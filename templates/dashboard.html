<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConfiForms Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.2.5/dist/css/tabulator_bootstrap5.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <div id="app" data-refresh-interval="{{ refresh_interval }}">

        <nav class="navbar navbar-expand-lg cf-navbar">
            <div class="container-fluid">
                <span class="navbar-brand">
                    <i class="fa-solid fa-table-cells-large me-2"></i>ConfiForms Dashboard
                </span>
                <div class="d-flex align-items-center cf-status">
                    <span id="last-refreshed" class="text-muted small me-3">
                        <i class="fa-regular fa-clock me-1"></i>Loading&hellip;
                    </span>
                    <button id="refresh-now" type="button" class="btn btn-sm btn-outline-secondary" title="Refresh now">
                        <i class="fa-solid fa-rotate"></i>
                    </button>
                </div>
            </div>
        </nav>

        <div id="error-banner" class="alert alert-danger m-3 d-none" role="alert"></div>

        <div class="container-fluid cf-view-switcher">
            <div class="btn-group" role="group" aria-label="Dashboard view" id="view-switcher">
                <button type="button" class="btn btn-view active" data-view="live">
                    <i class="fa-solid fa-bolt me-1"></i>Live Dashboard
                </button>
                <button type="button" class="btn btn-view" data-view="awaiting">
                    <i class="fa-solid fa-hourglass-half me-1"></i>Awaiting Queue
                </button>
                <button type="button" class="btn btn-view" data-view="archived">
                    <i class="fa-solid fa-box-archive me-1"></i>Archived Records
                </button>
            </div>
        </div>

        <div class="container-fluid cf-toolbar">
            <div class="row gy-2 align-items-center">
                <div class="col-12 col-lg-4">
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" id="global-search" class="form-control" placeholder="Search everything&hellip;">
                    </div>
                </div>

                <div class="col-6 col-lg-2">
                    <select id="filter-status" class="form-select" data-placeholder="Status">
                        <option value="">All Statuses</option>
                    </select>
                </div>

                <div class="col-6 col-lg-2">
                    <select id="filter-owner" class="form-select" data-placeholder="Owner">
                        <option value="">All Owners</option>
                    </select>
                </div>

                <div class="col-6 col-lg-2">
                    <select id="filter-category" class="form-select" data-placeholder="Category">
                        <option value="">All Categories</option>
                    </select>
                </div>
            </div>

            <div class="row gy-2 align-items-center mt-1">
                <div class="col-6 col-lg-2">
                    <label for="filter-date-from" class="form-label small text-muted mb-0">Date from</label>
                    <input type="date" id="filter-date-from" class="form-control form-control-sm">
                </div>
                <div class="col-6 col-lg-2">
                    <label for="filter-date-to" class="form-label small text-muted mb-0">Date to</label>
                    <input type="date" id="filter-date-to" class="form-control form-control-sm">
                </div>
                <div class="col-6 col-lg-2">
                    <label for="page-size" class="form-label small text-muted mb-0">Page size</label>
                    <select id="page-size" class="form-select form-select-sm">
                        <option value="25">25 / page</option>
                        <option value="50">50 / page</option>
                        <option value="100">100 / page</option>
                        <option value="0">Show all</option>
                    </select>
                </div>
            </div>

            <div class="row gy-2 align-items-center mt-1">
                <div class="col-12 col-lg-6">
                    <div class="btn-group" id="column-visibility-group">
                        <button type="button" class="btn btn-sm btn-outline-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="fa-solid fa-table-columns me-1"></i>Columns
                        </button>
                        <ul class="dropdown-menu" id="column-visibility-menu"></ul>
                    </div>
                    <button id="clear-filters" type="button" class="btn btn-sm btn-outline-secondary ms-2">
                        <i class="fa-solid fa-filter-circle-xmark me-1"></i>Clear Filters
                    </button>
                </div>
                <div class="col-12 col-lg-6 text-lg-end">
                    <div class="btn-group">
                        <button id="export-csv" type="button" class="btn btn-sm btn-outline-primary">
                            <i class="fa-solid fa-file-csv me-1"></i>CSV
                        </button>
                        <button id="export-xlsx" type="button" class="btn btn-sm btn-outline-primary">
                            <i class="fa-solid fa-file-excel me-1"></i>Excel
                        </button>
                        <button id="export-json" type="button" class="btn btn-sm btn-outline-primary">
                            <i class="fa-solid fa-file-code me-1"></i>JSON
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="container-fluid">
            <div id="cf-table"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/tabulator-tables@6.2.5/dist/js/tabulator.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
